# Fly app for Ellines EIP Identity.
# From repo root:
#   fly apps create ellines-eip-identity
#   fly secrets set DATABASE_URL=... DIRECT_URL=... JWT_SECRET=... --app ellines-eip-identity
#   fly deploy --config services/identity/fly.toml --dockerfile services/identity/Dockerfile

app = 'ellines-eip-identity'
primary_region = 'lhr'

[build]

[env]
  NODE_ENV = 'production'
  IDENTITY_SERVICE_PORT = '8080'
  CORS_ORIGINS = 'https://eip.ellines.co.ke,https://ellines-eip.pages.dev,http://localhost:3100'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
