# Deploy Identity to Fly from monorepo root (Dockerfile needs workspace context).
#
# Required GitHub Actions secret:
#   FLY_API_TOKEN  — Fly deploy / org token (https://fly.io/user/personal_access_tokens)

name: Deploy Identity (Fly)

on:
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - 'packages/shared/**'
      - 'packages/connectors-sdk/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-identity.yml'
  workflow_dispatch:

concurrency:
  group: identity-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret FLY_API_TOKEN. Create a Fly deploy token at https://fly.io/user/personal_access_tokens and add it under Settings → Secrets → Actions. See docs/08_Live_Identity_Setup.md."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy
        run: flyctl deploy --remote-only --config services/identity/fly.toml --dockerfile services/identity/Dockerfile --app ellines-eip-identity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
