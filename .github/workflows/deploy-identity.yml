# Deploy Identity to Fly from monorepo root (Dockerfile needs workspace context).

name: Deploy Identity (Fly)

on:
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-identity.yml'
  workflow_dispatch:

concurrency:
  group: identity-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --config services/identity/fly.toml --dockerfile services/identity/Dockerfile --app ellines-eip-identity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
