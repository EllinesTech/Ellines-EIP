name: Security Scan (SAST/DAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  # ────────────────────────────────────────────────
  # 1. Dependency vulnerability scan (Snyk)
  # ────────────────────────────────────────────────
  snyk:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/node@master
        continue-on-error: true   # Don't block on medium/low vulns; high+ will be flagged
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --all-projects
            --exclude=.next,.next-dev,dist,coverage

      - name: Upload Snyk SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: snyk.sarif

  # ────────────────────────────────────────────────
  # 2. CodeQL static analysis (SAST)
  # ────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for CodeQL analysis
        run: npm run build:shared
        continue-on-error: true  # CodeQL can analyze even partial builds

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ────────────────────────────────────────────────
  # 3. OWASP Dependency-Check
  # ────────────────────────────────────────────────
  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        continue-on-error: true   # Don't fail the job if NVD data fetch has issues
        with:
          project: "ellines-eip"
          path: "."
          format: "HTML,SARIF,JSON"
          out: "reports/owasp"
          args: >
            --enableRetired
            --failOnCVSS 8
            --exclude "**/node_modules/.cache/**"
            --exclude "**/.next/**"
            --exclude "**/coverage/**"

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('reports/owasp/**') != ''
        with:
          name: owasp-dependency-check
          path: reports/owasp/
          retention-days: 30

      - name: Upload OWASP SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('reports/owasp/dependency-check-report.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: reports/owasp/dependency-check-report.sarif

  # ────────────────────────────────────────────────
  # 4. Secret scanning (Gitleaks)
  # ────────────────────────────────────────────────
  secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for GITLEAKS_LICENSE Enterprise

  # ────────────────────────────────────────────────
  # 5. Audit summary
  # ────────────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+critical)
        run: mkdir -p reports && npm audit --audit-level=high --json > reports/npm-audit.json || true

      - name: Print audit summary
        run: |
          echo "## npm audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs = require('fs');
            try {
              const r = JSON.parse(fs.readFileSync('reports/npm-audit.json', 'utf8'));
              const meta = r.metadata?.vulnerabilities || {};
              console.log('| Severity | Count |');
              console.log('|----------|-------|');
              ['critical','high','moderate','low','info'].forEach(s => {
                console.log('| ' + s + ' | ' + (meta[s] || 0) + ' |');
              });
            } catch(e) { console.log('No audit data'); }
          " >> $GITHUB_STEP_SUMMARY

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: reports/npm-audit.json
          retention-days: 14
