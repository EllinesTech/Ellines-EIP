# Auto-deploy Ellines EIP web app to Cloudflare Pages on push to main.
#
# Required GitHub Actions secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN          — Cloudflare API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID         — Your Cloudflare account ID: ed3a8105e49e881d9d586a57da0f42bf
#   SUPABASE_URL                  — https://difrqfciratkwwvjlngp.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY     — Supabase service_role JWT (server-side only)
#   JWT_SECRET                    — EIP JWT signing secret (same as .env JWT_SECRET)
#   PLATFORM_ADMIN_EMAILS         — ellines.tech@gmail.com (comma-separated)
#
# Optional secrets (live email/push — simulated without them):
#   RESEND_API_KEY                — Resend email API key
#   VAPID_PUBLIC_KEY              — Web Push VAPID public key
#   VAPID_PRIVATE_KEY             — Web Push VAPID private key
#   VAPID_SUBJECT                 — mailto:noreply@ellines.co.ke
#   NEXT_PUBLIC_API_URL           — Override API base (empty = same-origin Pages Functions)
#
# CRITICAL — dual deploy race:
# Use ONLY this workflow OR Cloudflare Git builds — never both.

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Pages Functions imports
        run: npm run verify:pages-functions

      - name: Build shared packages
        run: npm run build:shared

      - name: Build web application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build -w @ellines-eip/web

      - name: Assert static export exists
        working-directory: apps/web
        run: |
          test -d out
          test -f out/index.html
          echo "Static export OK ($(find out -type f | wc -l) files)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          workingDirectory: apps/web
          command: pages deploy out --project-name=ellines-eip --commit-dirty=true --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Set Cloudflare Pages environment variables via wrangler ──────────
      # These become available to Pages Functions at runtime (not build time).
      # Run after every deploy so secrets stay in sync with the repo.
      - name: Set Pages environment secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set_secret() {
            local KEY="$1"
            local VAL="$2"
            if [ -n "$VAL" ]; then
              echo "$VAL" | npx wrangler pages secret put "$KEY" \
                --project-name=ellines-eip 2>/dev/null || true
              echo "✓ $KEY"
            else
              echo "⚠ $KEY not set in GitHub secrets — skipping"
            fi
          }

          set_secret SUPABASE_URL            "${{ secrets.SUPABASE_URL }}"
          set_secret SUPABASE_SERVICE_ROLE_KEY "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          set_secret JWT_SECRET              "${{ secrets.JWT_SECRET }}"
          set_secret PLATFORM_ADMIN_EMAILS   "${{ secrets.PLATFORM_ADMIN_EMAILS }}"
          set_secret RESEND_API_KEY          "${{ secrets.RESEND_API_KEY }}"
          set_secret VAPID_PUBLIC_KEY        "${{ secrets.VAPID_PUBLIC_KEY }}"
          set_secret VAPID_PRIVATE_KEY       "${{ secrets.VAPID_PRIVATE_KEY }}"
          set_secret VAPID_SUBJECT           "${{ secrets.VAPID_SUBJECT }}"
